<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work From Home — Writing Assignment Service</title>
  <meta name="description" content="Simple, genuine handwriting work for women — complete it from the comfort of your home, on your own schedule." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{color-scheme:dark;--bg-gradient:radial-gradient(ellipse at 50% 15%,#1e3156 0%,#101c33 50%,#0a1120 100%);--foreground:#f4f6fa;--muted-foreground:rgba(244,246,250,.76);--gold:#d4af37;--gold-soft:rgba(212,175,55,.12);--gold-border:rgba(212,175,55,.35);--gradient-gold:linear-gradient(135deg,#f5d77f 0%,#d4af37 50%,#b89128 100%);--font-serif:"Cormorant Garamond",Georgia,serif;--font-sans:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    html{min-height:100%;background:#0a1120}
    body{min-height:100vh;min-height:100svh;margin:0;padding:clamp(24px,6vh,56px) calc(16px + env(safe-area-inset-right)) clamp(24px,6vh,56px) calc(16px + env(safe-area-inset-left));display:flex;align-items:center;justify-content:center;overflow-x:hidden;background:var(--bg-gradient);background-attachment:fixed;color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    .container{width:min(100%,440px);margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
    .container>*{opacity:0;animation:rise-in 700ms cubic-bezier(.2,.75,.25,1) both}
    .container>:nth-child(1){animation-delay:0ms}.container>:nth-child(2){animation-delay:90ms}.container>:nth-child(3){animation-delay:160ms}.container>:nth-child(4){animation-delay:230ms}.container>:nth-child(5){animation-delay:300ms}.container>:nth-child(6){animation-delay:370ms}.container>:nth-child(7){animation-delay:440ms}.container>:nth-child(8){animation-delay:510ms}
    .logo-wrapper{position:relative;display:inline-flex;align-items:center;justify-content:center;margin-bottom:clamp(22px,5vw,32px)}
    .logo-img{display:block;width:clamp(112px,34vw,144px);height:clamp(112px,34vw,144px);border:2px solid var(--gold);border-radius:50%;object-fit:cover;box-shadow:0 10px 40px -10px rgba(212,175,55,.55);animation:gentle-float 5s ease-in-out 800ms infinite}
    .category-divider{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.5vw,12px);margin-bottom:16px;color:var(--gold);font-size:clamp(9px,2.7vw,11.5px);font-weight:600;letter-spacing:.22em;text-transform:uppercase}
    .category-divider .line{width:clamp(20px,7vw,32px);height:1px;flex:0 0 auto;background-color:var(--gold);opacity:.8}
    .headline{margin:0 0 6px;color:#fff;font-family:var(--font-serif);font-size:clamp(2.25rem,10vw,3rem);font-weight:700;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
    .sub-headline{margin:0 0 20px;color:var(--gold);font-family:var(--font-serif);font-size:clamp(1.35rem,6vw,1.65rem);font-style:italic;font-weight:600;line-height:1.2}
    .description{max-width:380px;margin:0 0 clamp(24px,6vw,32px);color:var(--muted-foreground);font-size:clamp(14px,3.8vw,15.5px);font-weight:300;line-height:1.65}
    .features-grid{display:grid;width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,2.5vw,12px);margin-bottom:clamp(26px,7vw,36px)}
    .feature-card{min-width:0;min-height:94px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold-border);border-radius:14px;background:var(--gold-soft);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform 200ms ease,border-color 200ms ease,background-color 200ms ease}
    .feature-card:hover{transform:translateY(-3px);border-color:rgba(212,175,55,.7);background-color:rgba(212,175,55,.17)}
    .feature-icon{width:24px;height:24px;flex:0 0 auto;color:var(--gold);stroke:currentColor}
    .feature-label{color:var(--foreground);font-size:clamp(10px,2.9vw,12px);font-weight:500;line-height:1.25;overflow-wrap:anywhere}
    .cta-button{position:relative;isolation:isolate;width:100%;min-height:54px;padding:15px 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:9999px;background:var(--gradient-gold);color:#0d1627;text-decoration:none;font-size:clamp(14px,4vw,16px);font-weight:600;letter-spacing:.01em;box-shadow:0 10px 35px -8px rgba(212,175,55,.5);transition:transform 200ms ease,box-shadow 200ms ease;-webkit-tap-highlight-color:transparent}
    .cta-button::after{position:absolute;z-index:-1;inset:-4px;border:1px solid rgba(245,215,127,.5);border-radius:inherit;content:"";pointer-events:none;animation:soft-ring 3s ease-out 1s infinite}
    .cta-button:hover{transform:translateY(-2px);box-shadow:0 14px 40px -6px rgba(212,175,55,.7)}.cta-button:active{transform:scale(.99)}
    .cta-button:focus-visible{outline:3px solid #fff;outline-offset:5px}
    .cta-button svg{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;stroke-width:2.2}
    .security-note{margin:18px 0 0;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted-foreground);font-size:12px;font-weight:400;line-height:1.5}
    .security-note svg{width:13px;height:13px;flex:0 0 auto;stroke:currentColor;stroke-width:2}
    @keyframes rise-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes gentle-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes soft-ring{0%{opacity:.65;transform:scale(.98)}75%,100%{opacity:0;transform:scale(1.06)}}
    @media(max-width:380px){.feature-card{min-height:88px;padding:12px 4px}.feature-icon{width:22px;height:22px}.feature-label{font-size:10px}}
    @media(max-height:640px) and (min-width:600px){body{align-items:flex-start}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
